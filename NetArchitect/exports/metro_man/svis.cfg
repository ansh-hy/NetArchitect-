! NetArchitect generated SVI configuration for a Layer 3 switch.
! Each SVI gateway uses the first usable address from the VLSM allocation.
hostname METRO-MAN-L3-SW
ip routing
!
interface Vlan10
 description HQ-USERS_GATEWAY
 ip address 10.20.0.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description REMOTE-USERS_GATEWAY
 ip address 10.20.1.1 255.255.255.0
 no shutdown
!
interface Vlan30
 description FINTECH_GATEWAY
 ip address 10.20.2.1 255.255.255.192
 no shutdown
!
interface Vlan99
 description MANAGEMENT_GATEWAY
 ip address 10.20.2.65 255.255.255.240
 no shutdown
!
! Multi-Area OSPF is recommended, but subnet-to-area mapping, area IDs and
! ABR/site mapping are missing. Do not configure all subnets in Area 0 as a substitute.
!
end
