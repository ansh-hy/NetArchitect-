! NetArchitect generated SVI configuration for a Layer 3 switch.
! Each SVI gateway uses the first usable address from the VLSM allocation.
hostname GLOBAL-WAN-L3-SW
ip routing
!
interface Vlan10
 description IOT_GATEWAY
 ip address 10.30.0.1 255.255.248.0
 no shutdown
!
interface Vlan20
 description OPERATIONS_GATEWAY
 ip address 10.30.8.1 255.255.255.0
 no shutdown
!
interface Vlan30
 description SERVERS_GATEWAY
 ip address 10.30.9.1 255.255.255.0
 no shutdown
!
interface Vlan99
 description MANAGEMENT_GATEWAY
 ip address 10.30.10.1 255.255.255.192
 no shutdown
!
! Multi-Area OSPF is recommended, but subnet-to-area mapping, area IDs and
! ABR/site mapping are missing. Do not configure all subnets in Area 0 as a substitute.
!
end
