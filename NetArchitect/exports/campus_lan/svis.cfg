! NetArchitect generated SVI configuration for a Layer 3 switch.
! Each SVI gateway uses the first usable address from the VLSM allocation.
hostname CAMPUS-LAN-L3-SW
ip routing
!
interface Vlan30
 description STUDENTS_GATEWAY
 ip address 10.10.0.1 255.255.252.0
 no shutdown
!
interface Vlan20
 description FACULTY_GATEWAY
 ip address 10.10.4.1 255.255.255.0
 no shutdown
!
interface Vlan10
 description ADMIN_GATEWAY
 ip address 10.10.5.1 255.255.255.128
 no shutdown
!
interface Vlan40
 description SERVERS_GATEWAY
 ip address 10.10.5.129 255.255.255.128
 no shutdown
!
interface Vlan99
 description MANAGEMENT_GATEWAY
 ip address 10.10.6.1 255.255.255.192
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.10.0.0 0.0.3.255 area 0
 network 10.10.4.0 0.0.0.255 area 0
 network 10.10.5.0 0.0.0.127 area 0
 network 10.10.5.128 0.0.0.127 area 0
 network 10.10.6.0 0.0.0.63 area 0
!
end
